<header>
  <h2><i class="bi bi-clipboard-check"></i> Controle de Inspeções</h2>

  <div class="top-actions">

    <!-- 🔗 Tratamento NC (visível para todos) -->
    <a href="https://coec-epb.github.io/tratamento_NC/"
       class="btn secondary"
       style="text-decoration:none;">
      <i class="bi bi-exclamation-triangle"></i> Tratamento NC
    </a>

    <!-- 🔐 ÁREA RESTRITA AO ADMIN -->
    <div id="areaAdmin" style="display:none;">

      <label for="excel" 
            style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">
        Importar inspeções (.xlsx)
      </label>
      <input type="file" id="excel" accept=".xlsx" style="margin-bottom:12px;">

      <label for="excelNC" 
            style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">
        Importar não conformidades (.xlsx)
      </label>
      <input type="file" id="excelNC" accept=".xlsx">

    </div>

    <button type="button" class="secondary" id="btnAbrirFreq">
      <i class="bi bi-graph-up"></i> Frequência
    </button>

    <button onclick="logout()">
      <i class="bi bi-box-arrow-right"></i> Sair
    </button>

  </div>
</header>
